[project]
name = "carbos"
revision = "1.0"

[profiles.default]
ATUIN_KEY = { description = "Atuin history encryption key, base64", required = true }
ZAI_API_KEY = { description = "Z.ai API key for MCP servers", required = true }
NEXTCLOUD_PASSWORD = { description = "Nextcloud app password for WebDAV and CalDAV", required = true }

[scopes.atuin]
secrets = ["ATUIN_KEY"]

[scopes.opencode]
secrets = ["ZAI_API_KEY"]

[scopes.nextcloud]
secrets = ["NEXTCLOUD_PASSWORD"]
